# checkov:skip=CKV_K8S_21:Namespace is bound via .Release.Namespace at helm install/template time; this chart is namespace-portable by design.
# ts:skip=AC_K8S_0086 Namespace is bound via .Release.Namespace at helm install/template time; this chart is namespace-portable by design.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "knowledge-explorer.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "knowledge-explorer.labels" . | nindent 4 }}
  annotations:
    checkov.io/skip1: CKV_K8S_21=namespace is set via .Release.Namespace, bound only at helm install/template time
data:
  {{- range $key, $value := .Values.env }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
